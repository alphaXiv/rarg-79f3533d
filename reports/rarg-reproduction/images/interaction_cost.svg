<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img">
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#667085}.axis{font-size:13px;fill:#667085}.label{font-size:14px;font-weight:650}.value{font-size:13px;font-weight:700}.note{font-size:12px;fill:#667085}</style>
<rect width="100%" height="100%" fill="#FFFFFF" rx="12"/>
<text class="title" x="55" y="45">Relevance reduced the text the agent had to inspect</text>
<text class="sub" x="55" y="70">Mean grep matches shown across 32 questions; lower is better</text>
<text class="label" x="172" y="146" text-anchor="end">DCI</text>
<rect x="190" y="125" width="557.5" height="30" rx="6" fill="#8B95A5"/>
<text class="value" x="759.5" y="146">88.5</text>
<text class="label" x="172" y="218" text-anchor="end">RARG</text>
<rect x="190" y="197" width="321.5" height="30" rx="6" fill="#2563EB"/>
<text class="value" x="523.5" y="218">51.0</text>
<text class="label" x="172" y="290" text-anchor="end">RARG+</text>
<rect x="190" y="269" width="289.8" height="30" rx="6" fill="#7C3AED"/>
<text class="value" x="491.8" y="290">46.0</text>
<text class="label" x="172" y="362" text-anchor="end">RARG++</text>
<rect x="190" y="341" width="283.3" height="30" rx="6" fill="#E11D48"/>
<text class="value" x="485.3" y="362">45.0</text>
<text x="190" y="455" class="label" fill="#0F766E">RARG++ exposed 49.2% fewer matches than DCI.</text>
<text class="note" x="820" y="480" text-anchor="end">Matched subset; same 30-match observation budget per step</text>
</svg>