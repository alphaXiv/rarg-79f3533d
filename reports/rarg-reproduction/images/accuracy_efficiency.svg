<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img">
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#667085}.axis{font-size:13px;fill:#667085}.label{font-size:14px;font-weight:650}.value{font-size:13px;font-weight:700}.note{font-size:12px;fill:#667085}</style>
<rect width="100%" height="100%" fill="#FFFFFF" rx="12"/>
<text class="title" x="55" y="45">Accuracy–efficiency frontier on 32 public questions</text>
<text class="sub" x="55" y="70">Higher and farther left is better · Qwen3-8B open judge · mean agent tool steps</text>
<line x1="120" y1="400.0" x2="835" y2="400.0" stroke="#D9E0EA"/>
<text class="axis" x="104" y="405.0" text-anchor="end">0%</text>
<line x1="120" y1="318.1" x2="835" y2="318.1" stroke="#D9E0EA"/>
<text class="axis" x="104" y="323.1" text-anchor="end">5%</text>
<line x1="120" y1="236.1" x2="835" y2="236.1" stroke="#D9E0EA"/>
<text class="axis" x="104" y="241.1" text-anchor="end">10%</text>
<line x1="120" y1="154.2" x2="835" y2="154.2" stroke="#D9E0EA"/>
<text class="axis" x="104" y="159.2" text-anchor="end">15%</text>
<line x1="188.1" y1="105" x2="188.1" y2="400" stroke="#D9E0EA"/>
<text class="axis" x="188.1" y="427" text-anchor="middle">1.5</text>
<line x1="358.3" y1="105" x2="358.3" y2="400" stroke="#D9E0EA"/>
<text class="axis" x="358.3" y="427" text-anchor="middle">2.0</text>
<line x1="528.6" y1="105" x2="528.6" y2="400" stroke="#D9E0EA"/>
<text class="axis" x="528.6" y="427" text-anchor="middle">2.5</text>
<line x1="698.8" y1="105" x2="698.8" y2="400" stroke="#D9E0EA"/>
<text class="axis" x="698.8" y="427" text-anchor="middle">3.0</text>
<polyline points="773.3,348.8 305.1,297.6 188.1,195.1 198.7,143.9" fill="none" stroke="#AAB4C3" stroke-width="3" stroke-dasharray="6 7"/>
<circle cx="773.3" cy="348.8" r="11" fill="#8B95A5" stroke="white" stroke-width="3"/>
<text class="label" x="761.3" y="328.8" text-anchor="end">DCI</text>
<text class="note" x="761.3" y="344.8" text-anchor="end">3.1% · 3.22 steps</text>
<circle cx="305.1" cy="297.6" r="11" fill="#2563EB" stroke="white" stroke-width="3"/>
<text class="label" x="317.1" y="325.6" text-anchor="start">RARG</text>
<text class="note" x="317.1" y="341.6" text-anchor="start">6.2% · 1.84 steps</text>
<circle cx="188.1" cy="195.1" r="11" fill="#7C3AED" stroke="white" stroke-width="3"/>
<text class="label" x="200.1" y="174.1" text-anchor="start">RARG+</text>
<text class="note" x="200.1" y="190.1" text-anchor="start">12.5% · 1.50 steps</text>
<circle cx="198.7" cy="143.9" r="11" fill="#E11D48" stroke="white" stroke-width="3"/>
<text class="label" x="210.7" y="123.9" text-anchor="start">RARG++</text>
<text class="note" x="210.7" y="139.9" text-anchor="start">15.6% · 1.53 steps</text>
<text class="axis" x="477.5" y="470" text-anchor="middle">Mean tool steps → fewer is better</text>
<text class="axis" transform="translate(28 260) rotate(-90)" text-anchor="middle">Judged answer accuracy</text>
<text class="note" x="835" y="485" text-anchor="end">n = 32 paired questions</text>
</svg>