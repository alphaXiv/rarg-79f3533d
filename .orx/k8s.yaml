apiVersion: batch/v1
kind: Job
metadata:
  name: rarg-repro-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 39600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reproduction
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "48"
              memory: "240Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "64"
              memory: "320Gi"
          volumeMounts:
            - name: shared-cache
              mountPath: /shared
      volumes:
        - name: shared-cache
          persistentVolumeClaim:
            claimName: rarg-repro-shared
